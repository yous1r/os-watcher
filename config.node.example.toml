# os-watcher 配置示例 —— 普通节点（node）
#
# 适用于只做采集、不托管 Web 面板的机器（对应发布包 os-watcher-*-node）。
# 复制为 config.toml 后按需修改；所有字段均有默认值，可只保留需要覆盖的项。

[node]
# name = "my-server"   # 节点名称，默认使用主机名
role = "agent"          # 普通节点只负责采集，由带面板的节点聚合展示

[metrics]
collect_interval_secs = 5      # 采集间隔（秒）
top_processes_count = 10       # 记录 CPU 占用最高的前 N 个进程
collect_processes = true       # 是否采集进程级指标

[network]
gossip_port = 7979              # Gossip/发现使用的 UDP 端口
enable_discovery = true         # 是否启用局域网广播自动发现
peers = []                      # 手动指定对等节点：["192.168.1.10:7979", "192.168.1.11:7979"]
announce_interval_secs = 30     # 广播自身存在的间隔（秒）
gossip_interval_secs = 10       # 向对等节点同步指标的间隔（秒）
max_hops = 3                    # Gossip 消息最大转发跳数
bind_addr = "0.0.0.0"           # 网络监听地址
# advertise_addr = "192.168.1.20"  # 多网卡/容器环境下手动指定对外通告的 IP

[api]
port = 7980                     # REST API 端口
bind_addr = "0.0.0.0"           # API 监听地址
enabled = true                  # 保持开启，便于 os-watcher status 本地排查

# 普通节点不托管前端面板
[web]
enabled = false

[storage]
db_path = "os-watcher.db"       # SQLite 数据库文件路径
retention_hours = 72            # 本地只留 3 天，长期历史由面板节点保存

[tui]
refresh_ms = 1000               # 终端面板刷新间隔（毫秒），启动时加 --tui 使用

[upgrade]
enabled = true                  # 开启版本检测与 /api/v1/upgrade 自升级接口
github_repo = "yous1r/os-watcher" # GitHub Release 仓库（owner/repo）
check_interval_secs = 1800      # 后台检测最新版本的间隔（秒）
package = "node"                # 默认升级普通节点包
service_name = "os-watcher"     # Linux systemd / Windows 服务名
# proxy = "http://127.0.0.1:7890" # 可选；也支持 HTTP_PROXY/HTTPS_PROXY 环境变量

# ---- 告警规则 ----
[[alerts]]
name = "high_cpu"
metric = "cpu"                  # cpu / memory / swap / disk / load1 / load5 / load15
operator = "gt"                 # gt / lt / gte / lte / eq
threshold = 90.0
consecutive_violations = 3      # 连续违规多少次后触发
severity = "warning"            # info / warning / critical

[[alerts]]
name = "high_memory"
metric = "memory"
operator = "gt"
threshold = 90.0
consecutive_violations = 2
severity = "warning"

[[alerts]]
name = "disk_almost_full"
metric = "disk"
operator = "gt"
threshold = 85.0
consecutive_violations = 1
severity = "critical"
