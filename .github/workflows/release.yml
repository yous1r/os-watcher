# GitHub Actions —— 推送 tag 时构建并发布 release
#
# 触发条件：推送形如 v1.2.3 的 tag
# 产物（每个平台输出两种包）：
#   os-watcher-{platform}-node.{tar.gz|zip}  —— 仅节点二进制，不含 Web 面板
#   os-watcher-{platform}-full.{tar.gz|zip}  —— 二进制 + web/dist 前端面板
#
# 两种包的 config.example.toml 来自不同模板，默认值不同：
#   node → config.node.example.toml（web.enabled = false，role = "agent"）
#   full → config.full.example.toml（web.enabled = true，web.dir = "web-dist"）
#
# 目标平台：
#   linux-x86_64        x86_64-unknown-linux-gnu
#   linux-x86_64-musl   x86_64-unknown-linux-musl  (全静态，适合无 glibc 环境)
#   linux-aarch64       aarch64-unknown-linux-gnu
#   windows-x86_64      x86_64-pc-windows-msvc

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RELEASE_REPO: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------ #
  #  构建前端面板（一次，产物供各平台复用）                              #
  # ------------------------------------------------------------------ #
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 构建前端面板
        run: |
          cd web
          npm install
          npm run build

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  # ------------------------------------------------------------------ #
  #  Linux 多平台构建（在 ubuntu-latest 上跑，含交叉编译）              #
  # ------------------------------------------------------------------ #
  build-linux:
    needs: build-web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            linker: ""
            cc: ""
          - target: x86_64-unknown-linux-musl
            platform: linux-x86_64-musl
            linker: ""
            cc: ""
          - target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            linker: aarch64-linux-gnu-gcc
            cc: aarch64-linux-gnu-gcc

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 稳定版 + 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: 安装系统依赖（musl / aarch64）
        run: |
          sudo apt-get update -qq
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-musl)
              sudo apt-get install -y musl-tools ;;
            aarch64-unknown-linux-gnu)
              sudo apt-get install -y gcc-aarch64-linux-gnu ;;
          esac

      - name: 构建 release 二进制
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
          CC_aarch64_unknown_linux_gnu: ${{ matrix.cc }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      # node 包：配置默认 web.enabled = false，不含前端资源
      - name: 打包 node 版（仅二进制）
        run: |
          DIST="os-watcher-${{ matrix.platform }}-node"
          mkdir -p "$DIST"
          cp "target/${{ matrix.target }}/release/os-watcher" "$DIST/"
          cp README.md     "$DIST/" 2>/dev/null || true
          cp deploy.sh     "$DIST/" 2>/dev/null || true
          cp config.node.example.toml "$DIST/config.example.toml"
          tar -czf "${DIST}.tar.gz" "$DIST"
          sha256sum "${DIST}.tar.gz" > "${DIST}.tar.gz.sha256"

      # full 包：配置默认 web.enabled = true 且 web.dir = "web-dist"，开箱即用
      - name: 打包 full 版（二进制 + Web 面板）
        run: |
          DIST="os-watcher-${{ matrix.platform }}-full"
          mkdir -p "$DIST"
          cp "target/${{ matrix.target }}/release/os-watcher" "$DIST/"
          cp README.md     "$DIST/" 2>/dev/null || true
          cp deploy.sh     "$DIST/" 2>/dev/null || true
          cp config.full.example.toml "$DIST/config.example.toml"
          cp -r web/dist   "$DIST/web-dist"
          tar -czf "${DIST}.tar.gz" "$DIST"
          sha256sum "${DIST}.tar.gz" > "${DIST}.tar.gz.sha256"

      - name: 上传两种产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            os-watcher-${{ matrix.platform }}-node.tar.gz
            os-watcher-${{ matrix.platform }}-node.tar.gz.sha256
            os-watcher-${{ matrix.platform }}-full.tar.gz
            os-watcher-${{ matrix.platform }}-full.tar.gz.sha256
          retention-days: 1

  # ------------------------------------------------------------------ #
  #  Windows x86_64 构建                                                #
  # ------------------------------------------------------------------ #
  build-windows:
    needs: build-web
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 稳定版
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            target
          key: windows-x86_64-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-x86_64-cargo-

      - name: 构建 release 二进制
        run: cargo build --release

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      - name: 打包 node 版（仅二进制）
        shell: pwsh
        run: |
          $dist = "os-watcher-windows-x86_64-node"
          New-Item -ItemType Directory -Path $dist | Out-Null
          Copy-Item "target\release\os-watcher.exe" "$dist\"
          if (Test-Path README.md) { Copy-Item README.md "$dist\" }
          if (Test-Path deploy.sh) { Copy-Item deploy.sh "$dist\" }
          Copy-Item config.node.example.toml "$dist\config.example.toml"
          Compress-Archive -Path $dist -DestinationPath "$dist.zip"
          $hash = (Get-FileHash "$dist.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $dist.zip" | Out-File "$dist.zip.sha256" -Encoding ASCII

      - name: 打包 full 版（二进制 + Web 面板）
        shell: pwsh
        run: |
          $dist = "os-watcher-windows-x86_64-full"
          New-Item -ItemType Directory -Path $dist | Out-Null
          Copy-Item "target\release\os-watcher.exe" "$dist\"
          if (Test-Path README.md) { Copy-Item README.md "$dist\" }
          if (Test-Path deploy.sh) { Copy-Item deploy.sh "$dist\" }
          Copy-Item config.full.example.toml "$dist\config.example.toml"
          Copy-Item web\dist "$dist\web-dist" -Recurse
          Compress-Archive -Path $dist -DestinationPath "$dist.zip"
          $hash = (Get-FileHash "$dist.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $dist.zip" | Out-File "$dist.zip.sha256" -Encoding ASCII

      - name: 上传两种产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-windows-x86_64
          path: |
            os-watcher-windows-x86_64-node.zip
            os-watcher-windows-x86_64-node.zip.sha256
            os-watcher-windows-x86_64-full.zip
            os-watcher-windows-x86_64-full.zip.sha256
          retention-days: 1

  # ------------------------------------------------------------------ #
  #  汇总所有产物 → 创建 GitHub Release                                 #
  # ------------------------------------------------------------------ #
  publish:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: 下载所有平台产物
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: release/
          merge-multiple: true

      - name: 校验文件列表
        run: ls -lh release/

      - name: 创建 GitHub Release 并上传所有文件
        uses: softprops/action-gh-release@v2
        with:
          # 从 tag 名生成 release 名称，如 v1.2.3 → "Release v1.2.3"
          name: "Release ${{ github.ref_name }}"
          # 自动从 CHANGELOG.md 中提取对应版本的内容作为正文（有则用，无则留空）
          generate_release_notes: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
