[package]
name = "os-watcher"
version = "0.0.7"
edition = "2021"
description = "A decentralized host resource monitoring tool"

[[bin]]
name = "os-watcher"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP API
axum = { version = "0.7", features = ["json"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# System metrics
sysinfo = "0.32"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# CLI
clap = { version = "4", features = ["derive"] }

# Logging/Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Database
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros", "chrono"] }
# Bundle SQLite from source so cross-compilation doesn't depend on a system libsqlite3.
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Config
config = "0.14"

# Networking utilities
uuid = { version = "1", features = ["v4", "serde"] }

# Async utilities
tokio-stream = "0.1"
futures = "0.3"

# Error handling
anyhow = "1"
thiserror = "1"

# HTTP client (for status command) — rustls 避免 OpenSSL 依赖，便于 musl 静态编译与跨平台打包
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Unix UID detection for sudo check in smartctl autoinstall
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["user"] }

[dev-dependencies]
tempfile = "3"
